name: "🔍 Validation / Planning Review"
description: "로컬 CLI 로그 픽스처 검증, 단가/정책 팩트체크, PRD 보완 리뷰"
title: "[Validation] "
labels: ["planning", "documentation"]
body:
  - type: textarea
    id: scope
    attributes:
      label: "🎯 검증 / 보완 대상"
      description: "검증이 필요한 CLI 로그 포맷, 요금제/단가 변동, PRD 섹션 명시"
      placeholder: "- 대상 항목:\n- 현재 가정/불확실성:"
    validations:
      required: true
  - type: checkboxes
    id: target_cli
    attributes:
      label: "🤖 대상 CLI / 영역"
      options:
        - label: "Gemini CLI (~/.gemini)"
        - label: "Claude Code (~/.claude)"
        - label: "OpenAI Codex CLI (~/.codex)"
        - label: "요금제/단가 카탈로그"
        - label: "macOS 아키텍처 / WidgetKit"
  - type: textarea
    id: findings_criteria
    attributes:
      label: "📋 검증 기준 및 완료 조건"
      value: |
        - [ ] 원문 로그/공식 문서 기반 팩트 검증 완료 (민감 정보·원문 프롬프트 익명화)
        - [ ] `raw/` 또는 `wiki/` 관련 페이지 반영
        - [ ] `wiki_tool.py lint` 통과 (Errors: 0, Warnings: 0)
    validations:
      required: true
  - type: input
    id: related_docs
    attributes:
      label: "🔗 연관 위키 / PRD 문서"
      placeholder: "예: wiki/syntheses/prd-agents-usage-mac.md"
